<!doctype html>
<html><body><canvas id="c"></canvas>
<script>
// A dice roll that resolves one die at a time.
const dice = [];
let total = 0;

async function rollAll() {
  for (const d of dice) {
    d.value = 1 + Math.floor(Math.random() * 6);
    d.flash = 1;
    sfx.play('land');
    total += d.value;
    drawTotal(total);
    await wait(100);
  }
}
</script></body></html>

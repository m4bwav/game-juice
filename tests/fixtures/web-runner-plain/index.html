<!doctype html>
<html>
<head><meta charset="utf-8"><title>Three-lane runner, plain</title><style>body { margin: 0; }</style></head>
<body>
<canvas id="c"></canvas>
<script>
const LANE_W = 120;
let lane = 1, obstacles = [], running = true, distance = 0;

function spawnObstacle() {
  obstacles.push({ lane: Math.floor(Math.random() * 3), z: 60 });
}

function changeLane(dir) {
  lane = Math.min(2, Math.max(0, lane + dir));
}

function checkCollisions() {
  for (const o of obstacles) {
    if (o.lane === lane && o.z < 1) {
      gameOver();
    }
  }
}

function gameOver() {
  running = false;
}

function update(dt) {
  for (const o of obstacles) o.z -= 30 * dt;
  distance += dt;
  checkCollisions();
}

addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft') changeLane(-1);
  if (e.code === 'ArrowRight') changeLane(1);
});
</script>
</body>
</html>

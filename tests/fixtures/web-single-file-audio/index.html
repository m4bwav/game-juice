<!doctype html>
<html>
<head><meta charset="utf-8"><title>Single-file shooter with one sound</title></head>
<body>
<canvas id="c" width="480" height="640"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');
const ac = new AudioContext();
let shots = [], lives = 3, score = 0;
const ship = { x: 240, y: 600 };

function shoot() {
  shots.push({ x: ship.x, y: ship.y - 12, vy: -9 });
}

function hitPlayer() {
  lives -= 1;
  const osc = ac.createOscillator();
  osc.frequency.value = 110;
  osc.connect(ac.destination);
  osc.start();
  osc.stop(ac.currentTime + 0.15);
}

function addScore(n) {
  score += n;
}
</script>
</body>
</html>

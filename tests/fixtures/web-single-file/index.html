<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Single-file shooter</title>
<script type="application/ld+json">{"name": "not code", "score += 1": true}</script>
<script src="vendor-not-scanned.js"></script>
<style>body { margin: 0; background: #000; }</style>
</head>
<body>
<canvas id="c" width="480" height="640"></canvas>
<script>
const ctx = document.getElementById('c').getContext('2d');
let shots = [], foes = [], lives = 3, score = 0;
const ship = { x: 240, y: 600 };

function shoot() {
  shots.push({ x: ship.x, y: ship.y - 12, vy: -9 });
}

function hitPlayer() {
  lives -= 1;
  foes.length = 0;
}

function addScore(n) {
  score += n;
}

function step() {
  for (const s of shots) s.y += s.vy;
  for (const f of foes) f.y += 2;
  requestAnimationFrame(step);
}

addEventListener('keydown', e => { if (e.code === 'Space') shoot(); });
step();
</script>
</body>
</html>

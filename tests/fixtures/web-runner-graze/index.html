<!doctype html>
<html>
<head><meta charset="utf-8"><title>Three-lane runner, forgiving</title></head>
<body>
<canvas id="c"></canvas>
<script>
const LANE_W = 120;
const HURT_MARGIN = 0.15;
const STUMBLE_WINDOW = 5.5;
let lane = 1, laneX = 1, obstacles = [], running = true, lastStumble = -99, t = 0;

function spawnObstacle() {
  obstacles.push({ lane: Math.floor(Math.random() * 3), z: 60, clearance: Infinity });
}

function changeLane(dir) {
  lane = Math.min(2, Math.max(0, lane + dir));
}

function checkCollisions() {
  for (const o of obstacles) {
    const gap = Math.abs(o.lane - laneX);
    if (o.z < 1) o.clearance = Math.min(o.clearance, gap);
    if (o.z < 1 && gap < 1 - HURT_MARGIN) {
      if (t - lastStumble < STUMBLE_WINDOW) gameOver();
      else { lastStumble = t; stumble(); }
    } else if (o.z < 0 && o.clearance < 1.25) {
      nearMiss(o);
    }
  }
}

function stumble() { laneX = lane; }
function nearMiss(o) { o.clearance = Infinity; }
function gameOver() { running = false; }

addEventListener('keydown', e => {
  if (e.code === 'ArrowLeft') changeLane(-1);
  if (e.code === 'ArrowRight') changeLane(1);
});
</script>
</body>
</html>
